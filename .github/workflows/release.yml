name: Release

# Published assets are built and verified from the exact release tag.
# Ad-hoc signed until Developer ID signing and notarization are available.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up packaging Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate tag, version and release notes
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -s "Releases/$VERSION.md"
          python3 Scripts/check-site.py
      - name: Build, test, and check
        run: |
          swift build
          swift test
          ./check.sh
      - name: Package and verify DMG and ZIP
        run: ./release.sh
      - name: Prepare release notes and checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          (cd dist && shasum -a 256 "Notchest-$VERSION.dmg" "Notchest-$VERSION.zip") > dist/SHA256SUMS.txt
          cp "Releases/$VERSION.md" release-notes.md
          {
            printf '\n### SHA-256\n\n```text\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
          } >> release-notes.md
      - name: Publish release with verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/Notchest-$VERSION.dmg" "dist/Notchest-$VERSION.zip" dist/SHA256SUMS.txt \
            --verify-tag --latest --title "Notchest $VERSION" \
            --notes-file release-notes.md
